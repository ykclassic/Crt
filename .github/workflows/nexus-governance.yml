name: Nexus Governance Control

on:
  schedule:
    - cron: "*/30 * * * *"   # Every 30 minutes
  workflow_dispatch:

jobs:
  run-governance:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read 

    env:
      PYTHONUNBUFFERED: 1
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      SINGLE_RUN: "true"

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2️⃣ Setup Python (with pip cache)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3️⃣ Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install --upgrade ccxt requests

      # 4️⃣ Native API Download specifically targeting nexus_pipeline.yml
      - name: Download Signals Database via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Finding latest successful run for nexus_pipeline.yml..."
          
          # Query specifically by workflow filename to get the correct Run ID
          RUN_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/nexus_pipeline.yml/runs?status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id')

          if [ "$RUN_ID" == "null" ] || [ -z "$RUN_ID" ]; then
            echo "❌ No successful runs found for nexus_pipeline.yml."
            exit 1
          end
          
          echo "📥 Target Run ID: $RUN_ID. Fetching artifact URL..."

          ARTIFACT_URL=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            | jq -r '.artifacts[]? | select(.name=="nexus_signals_db") | .archive_download_url')

          if [ -z "$ARTIFACT_URL" ] || [ "$ARTIFACT_URL" == "null" ]; then
            echo "❌ Artifact 'nexus_signals_db' not found in run $RUN_ID."
            exit 1
          fi

          echo "⬇️ Downloading artifact archive..."
          curl -s -L -H "Authorization: token $GH_TOKEN" "$ARTIFACT_URL" -o artifact.zip

          echo "📦 Extracting database..."
          unzip -o artifact.zip
          rm artifact.zip

      - name: Verify Database Exists
        run: |
          if [ ! -f nexus_signals.db ]; then
            echo "❌ nexus_signals.db not found after extraction!"
            ls -la
            exit 1
          fi
          echo "✅ Database successfully mounted."

      # 5️⃣ Run Alert Monitor
      - name: Run Alert Monitor
        run: |
          echo "🛡 Running Alert Monitor at $(date)"
          python alert_monitor.py

      # 6️⃣ Run Performance Audit
      - name: Run Performance Audit
        run: |
          echo "📊 Running Performance Audit"
          python audit_intelligence.py

      # 7️⃣ Commit updated performance + DB (if changed)
      - name: Commit Governance Updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -f nexus_signals.db || true
          git add performance.json || true

          if git diff --cached --quiet; then
            echo "No governance updates to commit."
          else
            git commit -m "Governance update [auto]"
            git push
          fi
