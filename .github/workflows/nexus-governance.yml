name: Nexus Governance Control

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: nexus-main-writer
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  run-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      SINGLE_RUN: "true"
      WORKFLOW_FILE: "alert_cron.yml"
      SIGNAL_ARTIFACT: "nexus_signals_db"
      DB_FILE: "runtime/nexus_signals.db"
      GOVERNANCE_DB_FILE: "nexus_governance.db"
      PERFORMANCE_FILE: "performance.json"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install --upgrade ccxt requests pandas

      - name: Resolve Latest Successful Pipeline Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?status=success&per_page=20" \
            > workflow_runs.json

          RUN_ID=$(jq -r '
            .workflow_runs
            | map(select(.conclusion == "success"))
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty
          ' workflow_runs.json)

          if [ -z "$RUN_ID" ]; then
            echo "❌ No successful ${WORKFLOW_FILE} run is available yet."
            exit 1
          fi

          echo "PIPELINE_RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "✅ Latest successful pipeline run: ${RUN_ID}"

      - name: Resolve Signals Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PIPELINE_RUN_ID}/artifacts?per_page=100" \
            > artifacts.json

          ARTIFACT_URL=$(jq -r '
            .artifacts[]
            | select(.name == "'"${SIGNAL_ARTIFACT}"'" and .expired == false)
            | .archive_download_url
          ' artifacts.json | head -n 1)

          if [ -z "$ARTIFACT_URL" ]; then
            echo "❌ Artifact '${SIGNAL_ARTIFACT}' was not found in run ${PIPELINE_RUN_ID}."
            exit 1
          fi

          echo "ARTIFACT_URL=${ARTIFACT_URL}" >> "$GITHUB_ENV"

      - name: Download Signals Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p runtime

          curl --fail-with-body --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "${ARTIFACT_URL}" \
            --output artifact.zip

          unzip -o artifact.zip -d runtime
          rm -f artifact.zip

          if [ ! -f runtime/nexus_signals.db ]; then
            echo "❌ runtime/nexus_signals.db was not found after extraction."
            find runtime -maxdepth 2 -type f -print
            exit 1
          fi

          echo "✅ Signal snapshot mounted at runtime/nexus_signals.db"

      - name: Validate Read-Only Signal Snapshot
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = Path("runtime/nexus_signals.db")
          conn = sqlite3.connect(db)

          try:
              integrity = conn.execute("PRAGMA integrity_check").fetchone()[0]
              if integrity != "ok":
                  raise RuntimeError(f"SQLite integrity check failed: {integrity}")

              columns = {
                  row[1]
                  for row in conn.execute("PRAGMA table_info(signals)")
              }

              required = {
                  "id", "engine_id", "symbol", "timeframe", "direction",
                  "entry", "stop_loss", "take_profit", "status", "timestamp"
              }

              missing = sorted(required - columns)
              if missing:
                  raise RuntimeError(
                      "Signal snapshot is missing required columns: "
                      + ", ".join(missing)
                  )

              print("✅ Signal snapshot integrity and schema validation passed.")
          finally:
              conn.close()
          PY

      - name: Initialize Governance Database
        shell: bash
        run: |
          set -euo pipefail
          python -m governance_db

      - name: Run Alert Monitor
        shell: bash
        run: |
          set -euo pipefail
          python alert_monitor.py

      - name: Run Performance Audit
        shell: bash
        run: |
          set -euo pipefail
          python audit_intelligence.py

      - name: Validate Governance Outputs
        shell: bash
        run: |
          set -euo pipefail

          test -f nexus_governance.db
          test -f performance.json

          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          governance = Path("nexus_governance.db")
          conn = sqlite3.connect(governance)
          try:
              integrity = conn.execute("PRAGMA integrity_check").fetchone()[0]
              if integrity != "ok":
                  raise RuntimeError(f"Governance DB integrity failed: {integrity}")

              required = {"signal_evaluations", "engine_governance", "schema_metadata"}
              tables = {
                  row[0]
                  for row in conn.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }
              missing = required - tables
              if missing:
                  raise RuntimeError(
                      "Governance DB missing tables: " + ", ".join(sorted(missing))
                  )
          finally:
              conn.close()

          with open("performance.json", "r", encoding="utf-8") as file:
              data = json.load(file)
          if not isinstance(data, dict):
              raise RuntimeError("performance.json must contain a JSON object")

          print(f"✅ Governance outputs validated. Engines: {len(data)}")
          PY

      - name: Commit Governance State
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # IMPORTANT: nexus_signals.db is intentionally absent from git staging.
          # It is pipeline-owned and was consumed from an artifact snapshot only.
          git add nexus_governance.db performance.json

          if git diff --cached --quiet; then
            echo "ℹ️ No governance state changes to commit."
            exit 0
          fi

          git commit -m "chore: persist Nexus governance state [skip ci]"
          git push origin HEAD:main
