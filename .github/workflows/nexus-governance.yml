name: Nexus Governance Control

on:
  schedule:
    - cron: "*/30 * * * *"   # Every 30 minutes
  workflow_dispatch:

jobs:
  run-governance:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read # Required to fetch the database artifact from the primary workflow

    env:
      PYTHONUNBUFFERED: 1
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      SINGLE_RUN: "true"

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2️⃣ Setup Python (with pip cache)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3️⃣ Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install --upgrade ccxt

      # 4️⃣ Download Database Artifact from Primary Pipeline
      - name: Download Signals Database
        uses: dawidd6/action-download-artifact@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: nexus_pipeline.yml # Matches primary workflow file name
          name: nexus_signals_db
          path: .

      - name: Verify Database Exists
        run: |
          if [ ! -f nexus_signals.db ]; then
            echo "❌ nexus_signals.db not found! Artifact download failed."
            exit 1
          fi
          echo "✅ Database successfully mounted."

      # 5️⃣ Run Alert Monitor
      - name: Run Alert Monitor
        run: |
          echo "🛡 Running Alert Monitor at $(date)"
          python alert_monitor.py

      # 6️⃣ Run Performance Audit
      - name: Run Performance Audit
        run: |
          echo "📊 Running Performance Audit"
          python audit_intelligence.py

      # 7️⃣ Commit updated performance + DB (if changed)
      - name: Commit Governance Updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -f nexus_signals.db || true
          git add performance.json || true

          if git diff --cached --quiet; then
            echo "No governance updates to commit."
          else
            git commit -m "Governance update [auto]"
            git push
          fi
