name: Nexus Alert Monitor

on:
  workflow_run:
    workflows: ["Nexus Intelligence Pipeline"]
    types:
      - completed
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    # Only run if the previous workflow actually succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    env:
      PYTHONUNBUFFERED: 1
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      SINGLE_RUN: "true"

    steps:
      # 1️⃣ Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2️⃣ Download Database Artifact from Triggering Run
      - name: Download Signals Database
        uses: actions/download-artifact@v4
        with:
          name: nexus_signals_db
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: . # Ensure it drops into the root directory directly

      # 3️⃣ Confirm DB Presence
      - name: Verify Database
        run: |
          if [ ! -f nexus_signals.db ]; then
            echo "❌ Database not found after artifact download."
            ls -R
            exit 1
          fi
          echo "✅ Database loaded."

      # 4️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 5️⃣ Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install --upgrade ccxt

      # 6️⃣ Run Alert Monitor
      - name: Run Alert Monitor
        run: |
          echo "🛡 Running Alert Monitor at $(date)"
          python alert_monitor.py
