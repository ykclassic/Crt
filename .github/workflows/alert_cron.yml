name: Nexus Intelligence Pipeline

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-nexus:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: 1
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

    steps:
      # 1️⃣ Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3️⃣ Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install --upgrade ccxt

      # 4️⃣ Run Nexus Engines
      - name: Run Nexus Engine
        run: |
          echo "🚀 Starting Nexus Engine at $(date)"
          python nexus_core.py
          python range_engine.py
          python hybrid_engine.py
          python ai_engine.py
          python run_consensus.py
          python nexus_dispatcher.py

      # 5️⃣ Verify Database Exists
      - name: Verify Database
        run: |
          if [ ! -f nexus_signals.db ]; then
            echo "❌ nexus_signals.db not found!"
            exit 1
          fi
          echo "✅ Database generated."

      # 6️⃣ Upload Database Artifact
      - name: Upload Signals Database
        uses: actions/upload-artifact@v4
        with:
          name: nexus_signals_db
          path: nexus_signals.db
          retention-days: 1
