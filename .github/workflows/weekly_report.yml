name: Nexus Weekly Performance Report

on:
  schedule:
    - cron: "59 23 * * 0"
  workflow_dispatch:

concurrency:
  group: nexus-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      GOVERNANCE_DB_FILE: nexus_governance.db
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Verify Governance Database
        run: |
          set -euo pipefail

          if [ ! -f nexus_governance.db ]; then
            echo "❌ nexus_governance.db not found."
            exit 1
          fi

          python - <<'PY'
          import sqlite3

          conn = sqlite3.connect("nexus_governance.db")
          try:
              integrity = conn.execute("PRAGMA integrity_check").fetchone()[0]
              if integrity != "ok":
                  raise RuntimeError(f"Governance DB integrity failed: {integrity}")
          finally:
              conn.close()
          print("✅ Governance database verified.")
          PY

      - name: Generate Weekly Report
        run: python performance_report.py

      - name: Persist Weekly Report
        run: |
          set -euo pipefail

          if [ ! -f weekly_performance_report.csv ]; then
            echo "❌ Weekly report was not generated."
            exit 1
          fi

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add weekly_performance_report.csv

          if git diff --cached --quiet; then
            echo "ℹ️ No weekly report changes to commit."
          else
            git commit -m "chore: archive weekly Nexus performance report [skip ci]"
            git push origin HEAD:main
          fi
