name: Aegis Sunday Performance Audit

on:
  schedule:
    - cron: '59 23 * * 0' # Every Sunday 23:59 UTC
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read # Required to download artifacts from other workflow runs
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests plotly kaleido

      - name: 📥 Download Nexus Database Artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: nexus_pipeline.yml
          name: nexus_signals_db
          path: .

      - name: 🛠️ Verify Database Exists
        run: |
          if [ ! -f nexus_signals.db ]; then
            echo "❌ nexus_signals.db not found! Artifact download failed."
            exit 1
          fi
          echo "✅ Production database successfully mounted."

      - name: 📊 Run Weekly Audit & Balance Check
        run: python performance_report.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: 💾 Persist Weekly Report
        run: |
          git config --local user.email "cto-bot@nexus-ai.com"
          git config --local user.name "Nexus CTO Bot"
          if [ -f "weekly_performance_report.csv" ]; then
            git add weekly_performance_report.csv
            git commit -m "Archive: Weekly Performance Report [skip ci]" || echo "Nothing to archive"
            git push origin main
          fi
